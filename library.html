<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stellars — Library</title>

    <!-- Ubuntu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <!-- Boxicons -->
    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="library.css">
</head>

<body>

    <!-- =========================================
         BACKGROUND VIDEO
    ========================================== -->

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source src="Videos/Bp1.mp4" type="video/mp4">
    </video>

    <div class="background-overlay"></div>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header>

        <nav>

            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >
                STELLARS
            </a>


            <!-- ADMIN
                 POSITIONED IN CENTER BY CSS
            -->

            <button
                class="admin-login-btn"
                id="adminLoginBtn"
                type="button"
            >
                <i class="bx bx-lock-alt"></i>

                <span>
                    Admin
                </span>
            </button>


            <!-- NAVIGATION -->

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="crewmates.html">
                        Crewmates
                    </a>
                </li>

                <li>
                    <a href="lecture.html">
                        Lecture
                    </a>
                </li>

                <li>
                    <a
                        href="library.html"
                        class="active"
                    >
                        Library
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>


        <!-- =====================================
             HERO
        ====================================== -->

        <section class="library-hero">

            <div class="hero-content">

                <p class="eyebrow">
                    STELLARS MEMORY LIBRARY
                </p>

                <h1>
                    Library
                </h1>

                <p>
                    A place for the moments,
                    memories, and stories
                    we made together.
                </p>

            </div>

        </section>


        <!-- =====================================
             LIBRARY
        ====================================== -->

        <section class="library-section">

            <div class="section-heading">

                <p class="eyebrow">
                    OUR MEMORIES
                </p>

                <h2>
                    Moments worth keeping.
                </h2>

                <button
                    class="add-memory-btn"
                    id="addMemoryBtn"
                    type="button"
                >
                    <i class="bx bx-plus"></i>
                    Add Memory
                </button>

            </div>


            <!-- =================================
                 MEMORY GRID
            ================================== -->

            <div
                class="library-grid"
                id="libraryGrid"
            >

                <!--
                    Firebase memory cards
                    akan otomatis muncul di sini.
                -->

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            © 2026 Stellars.
            Made for the memories.
        </p>

    </footer>


    <!-- =========================================
         ADD MEMORY MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="modalOverlay"
        aria-hidden="true"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <!-- HEADER -->

            <div class="modal-header">

                <h3 id="modalTitle">
                    Add a Memory
                </h3>

                <button
                    class="modal-close"
                    id="modalCloseBtn"
                    type="button"
                    aria-label="Close"
                >
                    <i class="bx bx-x"></i>
                </button>

            </div>


            <!-- FORM -->

            <form id="memoryForm">


                <!-- PHOTO -->

                <label class="modal-field">

                    <span>
                        Photo
                    </span>

                    <input
                        id="memoryPhoto"
                        type="file"
                        accept="image/*"
                        required
                    >

                </label>


                <!-- PREVIEW -->

                <div
                    class="modal-preview"
                    id="modalPreview"
                ></div>


                <!-- CATEGORY -->

                <label class="modal-field">

                    <span>
                        Category
                    </span>

                    <input
                        id="memoryCategory"
                        type="text"
                        maxlength="40"
                        placeholder="e.g. Event, Class, Trip"
                        required
                    >

                </label>


                <!-- TITLE -->

                <label class="modal-field">

                    <span>
                        Title
                    </span>

                    <input
                        id="memoryTitle"
                        type="text"
                        maxlength="80"
                        placeholder="Give this memory a title"
                        required
                    >

                </label>


                <!-- DESCRIPTION -->

                <label class="modal-field">

                    <span>
                        Description
                    </span>

                    <textarea
                        id="memoryDescription"
                        maxlength="300"
                        placeholder="Tell us a little about this moment..."
                        required
                    ></textarea>

                </label>


                <!-- SUBMIT -->

                <button
                    class="modal-submit"
                    type="submit"
                >
                    Save Memory
                </button>

            </form>

        </div>

    </div>


    <!-- =========================================
         ADMIN LOGIN MODAL
    ========================================== -->

    <div
        class="admin-modal-overlay"
        id="adminModalOverlay"
    >

        <div
            class="admin-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="adminModalTitle"
        >

            <!-- HEADER -->

            <div class="admin-modal-header">

                <h3 id="adminModalTitle">
                    Admin Login
                </h3>

                <button
                    class="admin-modal-close"
                    id="adminModalClose"
                    type="button"
                    aria-label="Close"
                >
                    <i class="bx bx-x"></i>
                </button>

            </div>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <label>

                    <span>
                        Email
                    </span>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Admin email"
                        autocomplete="email"
                        required
                    >

                </label>


                <!-- PASSWORD -->

                <label>

                    <span>
                        Password
                    </span>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Admin password"
                        autocomplete="current-password"
                        required
                    >

                </label>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="admin-submit"
                >
                    Login
                </button>


                <!-- STATUS -->

                <p
                    class="admin-status"
                    id="adminStatus"
                ></p>

            </form>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="library.js"
    ></script>

</body>
</html>
