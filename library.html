<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library | Stellars</title>

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="library.css">
</head>

<body>

    <!-- BACKGROUND -->
    <video class="background-video" autoplay muted loop playsinline>
        <source src="Videos/Bp1.mp4" type="video/mp4">
    </video>

    <div class="background-overlay"></div>
 

    <!-- NAVBAR -->
    <header>
        <nav>

            <div class="logo">
                STELLARS
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="lecturers.html">Lecturers</a>
                </li>

                <li>
                    <a href="library.html" class="active">Library</a>
                </li>

                <li>
                    <a href="crewmates.html">Crews</a>
                </li>

            </ul>

        </nav>
    </header>


    <!-- MAIN -->
    <main>

        <!-- HERO -->
        <section class="library-hero">

            <div class="hero-content">

                <p class="eyebrow">
                    MEMORIES OF STELLARS
                </p>

                <h1>
                    Library
                </h1>

                <p>
                    A collection of moments, memories,
                    and stories from our journey together.
                </p>

            </div>

        </section>


        <!-- LIBRARY -->
        <section class="library-section">

            <div class="section-heading">

                <p class="eyebrow">
                    OUR MEMORIES
                </p>

                <h2>
                    Moments We've Shared
                </h2>

                <button class="add-memory-btn" type="button" id="addMemoryBtn">
                    <i class='bx bx-plus'></i>
                    Add Memory
                </button>

            </div>


            <div class="library-grid" id="libraryGrid">


                <!-- CARD 1 -->
                <article class="memory-card" data-id="static-jean-villain">

                    <div class="memory-image">

                        <img
                            src="images/jean villain.jpeg"
                            alt="First Gathering"
                        >

                        <button class="memory-delete" type="button" aria-label="Delete memory">
                            <i class='bx bx-x'></i>
                        </button>

                    </div>

                    <div class="memory-info">

                        <p class="memory-category">
                            Kelas
                        </p>

                        <h3>
                            Detik-detik jean jadi villain
                        </h3>

                        <p class="memory-description">
                            aku marahhhh
                        </p>

                        <button class="memory-like" type="button">
                            <i class='bx bx-heart'></i>
                        </button>

                    </div>

                </article>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        <p>
            © 2026 Stellars — BP11
        </p>
    </footer>


    <!-- ADD MEMORY MODAL -->
    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <div class="modal-header">
                <h3>Add a Memory</h3>
                <button class="modal-close" type="button" id="modalCloseBtn">
                    <i class='bx bx-x'></i>
                </button>
            </div>

            <form id="memoryForm">

                <label class="modal-field">
                    <span>Photo</span>
                    <input type="file" id="memoryPhoto" accept="image/*" required>
                </label>

                <div class="modal-preview" id="modalPreview"></div>

                <label class="modal-field">
                    <span>Category</span>
                    <input type="text" id="memoryCategory" placeholder="e.g. CAMPUS LIFE" required>
                </label>

                <label class="modal-field">
                    <span>Title</span>
                    <input type="text" id="memoryTitle" placeholder="e.g. A Day Together" required>
                </label>

                <label class="modal-field">
                    <span>Description</span>
                    <textarea id="memoryDescription" placeholder="A short caption for this memory" rows="3" required></textarea>
                </label>

                <button type="submit" class="modal-submit">
                    Save Memory
                </button>

            </form>

        </div>

    </div>


    <script type="module" src="library.js"></script>

</body>
</html>
